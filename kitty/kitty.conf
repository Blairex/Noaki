# ╔═══════════════════════════════════════════════════════════╗
# ║  Kitty Terminal Configuration - Dark Glass Theme          ║
# ╚═══════════════════════════════════════════════════════════╝

# ━━━ FONT ━━━
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 9.0

# Better font rendering
disable_ligatures never
font_features none

# ━━━ CURSOR ━━━
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
cursor_stop_blinking_after 15.0

# ━━━ SCROLLBACK ━━━
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ━━━ MOUSE ━━━
mouse_hide_wait 3.0
url_style curly
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
copy_on_select no
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#
click_interval -1.0
focus_follows_mouse no
pointer_shape_when_grabbed arrow
default_pointer_shape beam
pointer_shape_when_dragging beam

# ━━━ PERFORMANCE ━━━
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ━━━ BELL ━━━
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab yes
command_on_bell none

# ━━━ WINDOW LAYOUT ━━━
remember_window_size  yes
initial_window_width  640
initial_window_height 400

enabled_layouts *
window_resize_step_cells 2
window_resize_step_lines 2
window_border_width 0.5pt
draw_minimal_borders yes
window_margin_width 0
single_window_margin_width -1
window_padding_width 8
placement_strategy center

# ━━━ TRANSPARENCY (essential for dark glass look) ━━━
background_opacity 0.75
background_blur 1
dynamic_background_opacity no

# ━━━ TAB BAR ━━━
tab_bar_edge bottom
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_style fade
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_separator " ┇"
tab_powerline_style angled
tab_activity_symbol none
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
active_tab_title_template none

# ━━━ COLOR SCHEME ━━━
# The basic colors
foreground              #D9D9D9
background              #262626
selection_foreground    #262626
selection_background    #A6A6A6

# Cursor colors
cursor                  #A6A6A6
cursor_text_color       #D9D9D9

# URL underline color when hovering with mouse
url_color               #D9D9D9

# Kitty window border colors
active_border_color     #595959
inactive_border_color   #595959
bell_border_color       #595959

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #D9D9D9
active_tab_background   #262626
inactive_tab_foreground #D9D9D9
inactive_tab_background #262626
tab_bar_background      #D9D9D9

# Colors for marks (marked text in the terminal)
mark1_foreground #262626
mark1_background #404040
mark2_foreground #262626
mark2_background #262626
mark3_foreground #262626
mark3_background #A6A6A6

# The 16 terminal colors

# black
color0  #15161E
#color8  #414868
color8  #888888

# red
color1  #F7768E
color9  #FF899D

# green
color2  #9ECE6A
color10 #B9F27C

# yellow
color3  #E0AF68
color11 #FFCB6B

# blue
color4  #7AA2F7
color12 #8DB4FF

# magenta
color5  #BB9AF7
color13 #C8A9FF

# cyan
color6  #7DCFFF
color14 #A4DAFF

# white
color7  #C0CAF5
color15 #FFFFFF

# ━━━ ADVANCED ━━━
shell .
editor .
close_on_child_death no
allow_remote_control yes
listen_on unix:/tmp/kitty
update_check_interval 0
clipboard_control write-clipboard write-primary

# ━━━ OS SPECIFIC ━━━
wayland_titlebar_color system
linux_display_server auto

# ━━━ KEYBOARD SHORTCUTS ━━━
kitty_mod ctrl+shift

# Clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+s paste_from_selection
map shift+insert paste_from_selection

# Scrolling
map kitty_mod+up scroll_line_up
map kitty_mod+down scroll_line_down
map kitty_mod+page_up scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home scroll_home
map kitty_mod+end scroll_end

# Window management
map kitty_mod+enter new_window
map kitty_mod+w close_window
map kitty_mod+] next_window
map kitty_mod+[ previous_window
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward
map kitty_mod+` move_window_to_top
map kitty_mod+r start_resizing_window

# Tab management
map kitty_mod+t new_tab
map kitty_mod+q close_tab
map kitty_mod+right next_tab
map kitty_mod+left previous_tab
map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward
map kitty_mod+alt+t set_tab_title

# Layout management
map kitty_mod+l next_layout

# Font sizes
map kitty_mod+equal change_font_size all +2.0
map kitty_mod+minus change_font_size all -2.0
map kitty_mod+0 change_font_size all 0

# Miscellaneous
map kitty_mod+f11 toggle_fullscreen
map kitty_mod+u kitten unicode_input
map kitty_mod+f2 edit_config_file
map kitty_mod+escape kitty_shell window

# ━━━ PLATFORM SPECIFIC ━━━
# Hide window decorations for clean look
hide_window_decorations no
wayland_enable_ime yes
confirm_os_window_close 0
